spring:
  application:
    name: agent-flow

  datasource:
    url: jdbc:mysql://localhost:3306/agent_flow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
    root: INFO
    com.agentflow: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000